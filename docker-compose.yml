services:
  easyfood-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_USE_FAKE_API: ${VITE_USE_FAKE_API:-true}
        VITE_ORDER_PENDING_TIMEOUT_MINUTES: ${VITE_ORDER_PENDING_TIMEOUT_MINUTES:-15}
    image: easyfood-web:latest
    container_name: easyfood-web
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATA_ROOT: /data
      ORDER_PENDING_TIMEOUT_MINUTES: ${VITE_ORDER_PENDING_TIMEOUT_MINUTES:-15}
    ports:
      - "${EASYFOOD_PORT:-8080}:8080"
    volumes:
      - easyfood-data:/data

volumes:
  easyfood-data:
