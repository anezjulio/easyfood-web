server {
    listen ${PORT};
    listen [::]:${PORT};

    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # =========================
    # FAKE API
    # =========================

    location ~ ^/(users|workdays|cash-opening-assignments|ingredients|menu-products|notifications|notification-settings|stock-threshold-settings|products|delete-requests|product-prices|price-margin-settings|operation-requests|orders|invoices|receipts|payment-method-settings|tax-settings|stocks|financial-accounts|financial-transactions|admin/data|uploads/images)(/|$) {

        proxy_pass https://easyfood-fake-api-production.up.railway.app;

        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name easyfood-fake-api-production.up.railway.app;

        proxy_set_header Host easyfood-fake-api-production.up.railway.app;

        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # IMAGENES
    # =========================

    location /images/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # =========================
    # FRONTEND REACT / VITE
    # =========================

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|mjs|svg|png|jpe?g|gif|ico|webp|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # =========================
    # HEALTHCHECK
    # =========================

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "OK";
    }
}